name: Publish Signal
on:
  push:
    branches: [main]
    paths: ['assets/**', 'data/editions/**', 'data/site.json', 'scripts/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: signal-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and build the publication
        run: python scripts/build.py
      # Listen: each edition is read aloud. Recordings are cached between runs, so only a new or
      # changed edition is recorded. If anything here fails, the site still publishes without audio.
      - name: Restore recorded editions
        uses: actions/cache/restore@v4
        with:
          path: .audio-cache
          key: narration-${{ github.run_id }}
          restore-keys: narration-
      - name: Restore the voice model
        uses: actions/cache@v4
        with:
          path: .kokoro
          key: kokoro-model-v1.0
      - name: Record the editions as audio
        id: narrate
        continue-on-error: true
        timeout-minutes: 55
        run: |
          python -m pip install --quiet "kokoro-onnx>=0.4.7,<0.7"
          mkdir -p .kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s .kokoro/kokoro-v1.0.onnx ] || curl -fsSL --retry 3 -o .kokoro/kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          [ -s .kokoro/voices-v1.0.bin ] || curl -fsSL --retry 3 -o .kokoro/voices-v1.0.bin "$base/voices-v1.0.bin"
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python scripts/narrate.py --out dist --cache .audio-cache --models .kokoro --days 30 --budget 40
      - name: Save recorded editions
        if: always()
        run: mkdir -p .audio-cache
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .audio-cache
          key: narration-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
