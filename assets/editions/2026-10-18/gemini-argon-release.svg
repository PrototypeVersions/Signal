<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="A segmented blue sphere with one section lifted away to reveal a glowing copper core">
<title>A segmented blue sphere with one section lifted away to reveal a glowing copper core</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2131"/><stop offset="1" stop-color="#08131d"/></linearGradient>
<radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .8  0 0 0 0 .87  0 0 0 0 .95  0 0 0 .07 0"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
<radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f3c9a5"/><stop offset=".6" stop-color="#d4a07d"/><stop offset="1" stop-color="#8a5a3c"/></radialGradient>
<linearGradient id="seg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5d83a6"/><stop offset="1" stop-color="#1c3550"/></linearGradient>
</defs>
<rect width="1200" height="800" fill="url(#bg)"/>
<ellipse cx="600" cy="660" rx="260" ry="34" fill="#000" opacity=".45" filter="url(#soft)"/>
<circle cx="600" cy="390" r="120" fill="#d4a07d" opacity=".35" filter="url(#glow)"/>
<circle cx="600" cy="390" r="74" fill="url(#core)"/>
<path d="M600.0,298.0 L600.0,180.0 A210,210 0 0 1 748.5,241.5 L665.1,324.9 A92,92 0 0 0 600.0,298.0 Z" fill="url(#seg)" fill-opacity="0.87" stroke="#c5d9f1" stroke-opacity=".55" stroke-width="2"/>
