<path d="M600.0,482.0 L600.0,600.0 A210,210 0 0 1 451.5,538.5 L534.9,455.1 A92,92 0 0 0 600.0,482.0 Z" fill="url(#seg)" fill-opacity="0.68" stroke="#c5d9f1" stroke-opacity=".55" stroke-width="2"/>
