<path d="M508.0,390.0 L390.0,390.0 A210,210 0 0 1 451.5,241.5 L534.9,324.9 A92,92 0 0 0 508.0,390.0 Z" fill="url(#seg)" fill-opacity="0.98" stroke="#c5d9f1" stroke-opacity=".55" stroke-width="2"/>
